# Example idu configuration.
#
# By default idu searches ., os.UserConfigDir()/idu, and $HOME/.config/idu for
# config.yaml. When config.yaml exists, it reads it along with any files listed
# under filesystem_config_files: and merges their filesystems: entries. If no config.yaml
# exists, idu discovers and merges all .yaml/.yml (and .env) files in
# os.UserConfigDir()/idu and $HOME/.config/idu.
#
# You can also point idu directly at this file with:
#   idu --config=example-config.yml config show

# Logging, the --log-level, --log-file, --log-format and --log-source-code
# flags override these settings.
logging:
  level: 0          # 0=error, 1=warn, 2=info, 3=debug
  # file: /tmp/idu.log  # defaults to stderr, - for stdout
  format: json      # json or text

vars:
  db_root: ./local-database

common_exclusions: &common_exclusions
  - '.DS_Store$'

# Split per-filesystem configs across files by placing config.yaml and one file
# per filesystem (e.g. home.yaml, asbhatt.yaml) in $HOME/.config/idu:
# filesystem_config_files:
#   - home.yaml
#   - dropbox.yaml
#   - asbhatt.yaml

filesystems:
  - name: home
    root: /Users/cnicolaou
    database: ${db_root}/cnicolaou
    stats_dir: ./stats/home
    concurrent_scans: 5000
    concurrent_stats: 2000
    concurrent_stats_threshold: 10
    scan_size: 2000
    exclusions:
      - <<: *common_exclusions
      - '^/Users/cnicolaou/Library/CloudStorage'
    # Files that are modified in place, such as logs and databases, do not
    # change their directory and hence are not noticed by analyze unless
    # they are re-stat'ed. Each pattern is matched against a file's full
    # path; every match costs a stat on every analyze, which is reported as
    # "files restated" in analyze's summary. None are restat'ed by default.
    # restat:
    #   - '\.log$'
    #   - '\.sqlite3?$'
    #   - '\.(vmdk|qcow2|vdi)$'
    #   - '^/Users/cnicolaou/Library/Mail/'
    compact_interval_days: 7
    # Optional, replaces the top-level logging configuration for this
    # filesystem; the --log-* flags still override it.
    # logging:
    #   level: 2
    #   file: /tmp/idu-home.log
    compact_interval: 12h
    # The space allocated to each file is determined automatically (the
    # default allocated layout); the block size is only used on systems
    # where that is not possible.
    layout:
      calculator: block
      parameters:
        size: 4KiB

  - name: dropbox
    root: /Users/cnicolaou/Dropbox (Personal)
    database: ${db_root}/dropbox
    exclusions:
      - <<: *common_exclusions
    layout:
      calculator: bytes

  - name: usr-local
    root: /usr/local
    database: ${db_root}/usr-local
    count_hardlinks_as_files: false
    # summaries (default), summaries-all or rescan, see hardlink_dedup in
    # iduconfig.
    hardlink_dedup: summaries
    # Directories (prefixes) whose summaries record every file, as for
    # summaries-all, so that links created to their files from elsewhere
    # are deduplicated even though the directories are not rescanned.
    # Each pattern is matched against a directory's full path; idu stats
    # suggest lists candidates. Changing the list causes the next analyze
    # to rewrite all of the summaries.
    # hardlinks_record_all:
    #   - '^/usr/local/backups(/|$)'

  - name: tmp
    root: /tmp
    database: ${db_root}/tmp

  # A range of keys in a key oriented store, such as an object store, is
  # specified using start_prefix and, optionally, stop_prefix instead of root.
  # The range includes start_prefix and excludes stop_prefix, which is the
  # first key, in lexicographic order, outside of the range; if omitted the
  # range contains exactly those keys that start with start_prefix.
  # - name: alpha-objects
  #   start_prefix: projects/alpha/
  #   stop_prefix: projects/alpha0
  #   database: ${db_root}/alpha-objects

  - name: asbhatt
    root: /labs/asbhatt
    database: ${db_root}/asbhatt
    concurrent_scans: 5000
    concurrent_stats: 2000
    layout:
      calculator: raid0
      parameters:
        stripe_size: 64KiB
        num_stripes: 4
